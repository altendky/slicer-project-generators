name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  all:
    name: all
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned CI tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
        with:
          version: 2026.7.17
          sha256: 8aba14e84ffeb312ca600f1a16b23c217c0d7f55c64d93f867f754efed3d8a43
          cache: false
          install_args: --locked
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94 --profile minimal --component rustfmt,clippy
      - name: Check metadata
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Check jq
        run: jq --version
      - name: Check scaffold invariants and stubs
        run: scripts/check-scaffold.sh
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Check dependencies
        run: cargo deny check
      - name: Check workflows
        run: actionlint
      - name: Check shell scripts
        run: shellcheck scripts/check-scaffold.sh
      - name: Check documentation links
        run: |
          while IFS= read -r -d '' path; do
              case "${path,,}" in
                  *.md|*.markdown|*.mdown|*.mdx|*.mkd|*.mdwn|*.mkdn|*.mkdown)
                      printf '%s\0' "${path}"
                      ;;
              esac
          done < <(git ls-files -z) \
              | xargs -0 lychee --include-fragments --no-progress
