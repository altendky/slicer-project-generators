name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  all:
    name: all
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94 --profile minimal --component rustfmt,clippy
      - name: Check metadata
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Check jq
        run: jq --version
      - name: Check scaffold invariants and stubs
        run: scripts/check-scaffold.sh
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.9 --locked
      - name: Check dependencies
        run: cargo deny check
